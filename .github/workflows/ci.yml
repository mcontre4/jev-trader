name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --log-opts="--all" /repo

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.2.1
      - run: poetry -C backend install --no-interaction
      - run: poetry -C backend run ruff check src tests
      - run: poetry -C backend run mypy
      - run: poetry -C backend run python scripts/check_hexagonal_boundaries.py --root src
      - run: poetry -C backend run tach check
      - name: Unit tests and coverage
        run: >-
          poetry -C backend run pytest tests/unit
          --cov=app.shared.application --cov=app.shared.domain
          --cov=app.users.application --cov=app.users.domain --cov=app.users.ports
          --cov=app.trading.domain --cov=app.trading.application --cov=app.trading.ports
          --cov-fail-under=95
      - run: poetry -C backend run pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit
